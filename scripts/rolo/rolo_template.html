<script>
/* Marca o documento como "tem JavaScript" ANTES de o navegador desenhar
   qualquer coisa. É o interruptor que decide quem lê o texto-fonte:

     sem JS  -> esta linha nunca roda, não há classe, o texto fica visível
                e a obra é legível como qualquer página estática;
     com JS  -> a classe entra, o CSS tira o texto-fonte do fluxo no mesmo
                instante, e o navegador não gasta um milissegundo desenhando
                um texto que o motor vai recolher meio segundo depois.

   Uma ferramenta que só busca a URL não executa nem JS nem CSS: para ela o
   texto está lá, escrito, do mesmo jeito. */
document.documentElement.classList.add('js');
</script>

  /* ================= TEXTO-FONTE PRÉ-RENDERIZADO =================
     Este bloco é o texto da obra, escrito no HTML como caracteres reais.
     Sem JavaScript, é isto que se lê — e é isto que uma IA lê ao buscar a URL.
     Com JavaScript, o motor consome estes mesmos elementos e os reorganiza
     na árvore recolhível: o texto existe UMA vez só nos bytes do arquivo. */
  .fonte-texto{padding:.4rem 0 1rem;}
  /* O custo de ter o texto no <body> é o navegador precisar desenhá-lo todo
     antes de o motor conseguir recolher as seções — num rolo de 27 MB isso é a
     espera que se vê na tela. `display:none` não impede a leitura por máquina
     (o texto continua escrito no arquivo) mas dispensa o navegador de calcular
     a posição de cada linha. O motor tira os elementos daqui um a um, sob
     demanda: é a mesma preguiça de sempre, agora começando antes do primeiro
     desenho em vez de depois. */
  html.js .fonte-texto{display:none;}
  .fonte-texto h1,.fonte-texto h2,.fonte-texto h3,.fonte-texto h4,.fonte-texto h5,.fonte-texto h6,

  }

<script>
/* ================================================================
   ROLO — motor de leitura (progressive enhancement)

   O texto NÃO nasce aqui. Ele já está no <body>, escrito como HTML
   visível dentro de #texto. Este script apenas o LÊ, monta a árvore
   de seções recolhíveis e reaproveita os MESMOS elementos <p> — não
   recria nem duplica nenhum caractere. Se este script não rodar, o
   leitor (humano ou máquina) continua vendo a obra inteira.
   ================================================================ */
const TITULO = document.querySelector('.cabecalho-app h1')?.textContent || 'Pedra Angular';
const MENU_MD = `
# Ajustes
Tudo aqui é texto. A configuração É o rolo.
## Aparência
[[cmd:tema:noite|Fundo azul-noite]]
[[cmd:tema:pergaminho|Fundo pergaminho]]
[[cmd:tema:petroleo|Fundo azul-petróleo]]
## Sobre
Ὁ Διαφορεύς παρῆν. Este arquivo carrega o texto, a fonte, o programa e a voz — tudo num só lugar.
`.trim();

/* ---------- parser A: DOM pré-renderizado -> árvore (sem copiar texto) ---------- */
function parseDOM(raiz_el){
  const raiz={tipo:'raiz',nivel:0,filhos:[]};
  const pilha=[raiz];
  for(const el of [...raiz_el.children]){
    const n = parseInt(el.dataset.n||'0',10);
    if(n>0){
      const no={tipo:'heading',nivel:n,texto:el.textContent.trim(),filhos:[],el};
      while(pilha.length && pilha[pilha.length-1].nivel>=n) pilha.pop();
      no.pai=pilha[pilha.length-1];
      pilha[pilha.length-1].filhos.push(no);
      pilha.push(no);
    }else{
      const no={tipo:'linha',el,pai:pilha[pilha.length-1]};
      Object.defineProperty(no,'texto',{get(){return el.textContent.trim();}});
      pilha[pilha.length-1].filhos.push(no);
    }
  }
  return raiz;
}
/* ---------- parser B: markdown -> árvore (só para o menu de ajustes) ---------- */
function parseMD(md){
  const raiz={tipo:'raiz',nivel:0,filhos:[]}; const pilha=[raiz];
  for(const linha of md.split('\n')){
    if(!linha.trim()) continue;
    const m=linha.match(/^(#{1,})\s+(.*)$/);
    if(m){
      const no={tipo:'heading',nivel:m[1].length,texto:m[2],filhos:[]};
      while(pilha.length && pilha[pilha.length-1].nivel>=no.nivel) pilha.pop();
      no.pai=pilha[pilha.length-1]; pilha[pilha.length-1].filhos.push(no); pilha.push(no);
    }else{
      pilha[pilha.length-1].filhos.push({tipo:'cmd',texto:linha,pai:pilha[pilha.length-1]});
    }
  }
  return raiz;
}

/* ============ comandos ============ */
const acoes={
  'tema:noite':()=>aplicarTema('noite','azul-noite'),
  'tema:pergaminho':()=>aplicarTema('pergaminho','pergaminho'),
  'tema:petroleo':()=>aplicarTema('petroleo','azul-petróleo'),
  'fonte:mais':()=>ajustarFonte(.1,'Letra maior'),
  'fonte:menos':()=>ajustarFonte(-.1,'Letra menor'),
  'expandir:tudo':()=>{abrirTudo(true);flash('Rolo aberto');},
  'recolher:tudo':()=>{abrirTudo(false);flash('Rolo recolhido');},
};
function guardar(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ler(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function aplicarTema(nome,label){
  document.body.setAttribute('data-theme',nome); guardar('pa:tema',nome);
  document.querySelectorAll('[data-cmd^="tema:"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cmd==='tema:'+nome?'true':'false'));
  if(label) flash('Fundo: '+label);
}
function ajustarFonte(delta,msg){
  const atual=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale'))||1;
  const novo=Math.min(2.6,Math.max(.8,+(atual+delta).toFixed(2)));
  document.documentElement.style.setProperty('--font-scale',novo); guardar('pa:fonte',novo);
  if(msg) flash(msg+' ('+Math.round(novo*100)+'%)');
}

/* ============ render PREGUIÇOSO ============ */
const RX_COORD=/^(\d+[a-e]?|§\s?\d+|\d+:\d+|\d+\.\d+)$/;
const RX_HEBRAICO=/[֐-׿]/;
let seq=0;
function citacaoDe(no){
  let autor='',obra='',p=no.pai;
  while(p){ if(p.nivel===3&&!obra)obra=p.texto; if(p.nivel===2&&!autor)autor=p.texto; p=p.pai; }
  const partes=[autor||AUTOR_OBRA,obra||TITULO].filter(Boolean).join(', ');
  return (partes?partes+' ':'')+no.texto+'  ·  '+location.href.split('#')[0]+'  ·  Pedra Angular — Ὁ Διαφορεύς παρῆν';
}
const AUTOR_OBRA=(document.querySelector('.cabecalho-app .autor')?.textContent||'').trim();
function idiomaDoTexto(t){
  /* Limiar de 30%: sem ele UM caractere manda na linha inteira, e o site
     escreve Φ e Ξ em portugues o tempo todo (sao os nomes dos botoes).
     Mesma regra do app, em src/lib/idioma.ts. */
  const letras=(t.match(/\p{L}/gu)||[]).length; if(!letras) return {lang:'pt-BR',dir:'ltr',voz:'pt-BR'};
  const conta=rx=>(t.match(rx)||[]).length/letras;
  if(conta(/[\u0590-\u05FF\uFB1D-\uFB4F]/g)>=.3) return {lang:'he',dir:'rtl',voz:'he-IL'};
  if(conta(/[\u0370-\u03FF\u1F00-\u1FFF]/g)>=.3) return {lang:'grc',dir:'ltr',voz:'el-GR'};
  if(conta(/[\u0400-\u04FF]/g)>=.3) return {lang:'ru',dir:'ltr',voz:'ru-RU'};
  return {lang:'pt-BR',dir:'ltr',voz:'pt-BR'};
}
/* botão de comando do menu de ajustes (único conteúdo ainda vindo de markdown) */
function renderCmd(texto){
  const cmd=texto.match(/^\[\[cmd:([^\|\]]+)\|([^\]]+)\]\]$/);
  if(cmd){
    const [_,id,rot]=cmd;
    const b=document.createElement('button');b.className='botao-cmd';b.dataset.cmd=id;
    if(id.startsWith('tema:'))b.setAttribute('aria-pressed',id==='tema:'+(document.body.getAttribute('data-theme')||'noite')?'true':'false');
    b.innerHTML='<span class="marca">[[cmd:'+id+']]</span><span class="rotulo">'+rot+'</span>';
    b.addEventListener('click',()=>acoes[id]&&acoes[id]());
    return b;
  }
  const p=document.createElement('p');p.className='paragrafo';p.textContent=texto;return p;
}
function renderFilho(no){
  if(no.tipo==='cmd') return renderCmd(no.texto);
  if(no.tipo==='linha') return no.el;            // reaproveita o elemento pré-renderizado
  if(no.nivel>=4 && RX_COORD.test(no.texto)){
    const wrap=document.createElement('div');wrap.className='coord-wrap';
    const c=document.createElement('div');c.className='coordenada';
    const primeira=no.filhos.find(f=>f.tipo==='linha');
    if(primeira && RX_HEBRAICO.test(primeira.texto)) c.classList.add('rtl');
    const m=document.createElement('span');m.className='marca-coord';m.textContent=no.texto;
    const cp=document.createElement('button');cp.className='copiar';cp.textContent='copiar referência';
    cp.setAttribute('aria-label','Copiar referência de '+no.texto);
    cp.addEventListener('click',async()=>{const r=citacaoDe(no);
      try{await navigator.clipboard.writeText(r);flash('Referência copiada');}catch(e){flash(r);}});
    c.appendChild(m);c.appendChild(cp);wrap.appendChild(c);
    if(no.el && no.el.id) wrap.id=no.el.id;
    no.filhos.forEach(f=>wrap.appendChild(renderFilho(f)));
    return wrap;
  }
  return renderHeading(no);
}
function renderHeading(no){
  const secao=document.createElement('div');secao.className='secao';secao._no=no;secao._built=false;
  secao.dataset.nivel=no.nivel; secao.dataset.par=(no.nivel%2===0)?'1':'0';
  secao.style.setProperty('--nivel', no.nivel);
  if(no.el && no.el.id) secao.id=no.el.id;
  const id='sec-'+(seq++);
  no._secao=secao;

  const row=document.createElement('div');row.className='heading-row';
  const toggleBtn=document.createElement('button');toggleBtn.type='button';toggleBtn.className='titulo-toggle';
  toggleBtn.setAttribute('aria-expanded','false');toggleBtn.setAttribute('aria-controls',id);
  const caret=document.createElement('span');caret.className='caret';caret.setAttribute('aria-hidden','true');caret.textContent='▸';
  const tit=document.createElement('span');tit.className='titulo';tit.textContent=no.texto;
  toggleBtn.appendChild(caret);toggleBtn.appendChild(tit);
  toggleBtn.addEventListener('click',()=>toggle(secao));
  row.appendChild(toggleBtn);

  const ouvir=document.createElement('button');ouvir.type='button';ouvir.className='ouvir-secao';
  ouvir.textContent='ouvir';ouvir.setAttribute('aria-label','Ouvir '+no.texto);
  ouvir.addEventListener('click',e=>{e.stopPropagation();lerSecao(no);});
  row.appendChild(ouvir);

  const menuBtn=document.createElement('button');menuBtn.type='button';menuBtn.className='menu-secao';
  menuBtn.textContent='⋯';menuBtn.setAttribute('aria-label','Mais ações para '+no.texto);
  menuBtn.setAttribute('aria-haspopup','true');menuBtn.setAttribute('aria-expanded','false');
  const painel=document.createElement('div');painel.className='painel-acoes';painel.hidden=true;
  [['Copiar — tudo',()=>copiarSecao(secao,no,true)],
   ['Copiar — só visível',()=>copiarSecao(secao,no,false)],
   ['Copiar link desta seção',()=>copiarLink(secao,no)],
   ['Imprimir — tudo',()=>imprimirSecao(secao,no,true)],
   ['Imprimir — só visível',()=>imprimirSecao(secao,no,false)],
  ].forEach(([rotulo,fn])=>{
    const b=document.createElement('button');b.type='button';b.className='item-acao';b.textContent=rotulo;
    b.addEventListener('click',e=>{e.stopPropagation();fecharPainel();fn();});
    painel.appendChild(b);
  });
  function fecharPainel(){painel.hidden=true;menuBtn.setAttribute('aria-expanded','false');document.removeEventListener('click',foraDoPainel);}
  function foraDoPainel(e){if(!painel.contains(e.target)&&e.target!==menuBtn)fecharPainel();}
  menuBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const abrir=painel.hidden;
    document.querySelectorAll('.painel-acoes').forEach(p=>{if(p!==painel)p.hidden=true;});
    painel.hidden=!abrir;
    menuBtn.setAttribute('aria-expanded',abrir?'true':'false');
    if(abrir) setTimeout(()=>document.addEventListener('click',foraDoPainel),0);
  });
  row.appendChild(menuBtn);row.appendChild(painel);

  const inner=document.createElement('div');inner.className='filhos-inner';inner.id=id;inner.hidden=true;
  secao._inner=inner;secao._row=row;secao._toggleBtn=toggleBtn;
  secao.appendChild(row);secao.appendChild(inner);
  return secao;
}
function construir(secao){
  if(secao._built) return;
  secao._no.filhos.forEach(f=>secao._inner.appendChild(renderFilho(f)));
  secao._built=true;
}
function construirRecursivo(secao){
  construir(secao);
  secao._inner.querySelectorAll(':scope > .secao').forEach(construirRecursivo);
}
function marcarCaminho(secaoEl){
  let el=secaoEl;
  while(el && el.classList && el.classList.contains('secao')){
    el.dataset.noCaminho='1';
    el=el.parentElement && el.parentElement.closest('.secao');
  }
}
function abrirRecursivo(secaoEl){
  toggle(secaoEl,true);
  secaoEl._inner.querySelectorAll(':scope > .secao').forEach(abrirRecursivo);
}
function imprimirSecao(secaoEl,no,modoTudo){
  if(modoTudo){construirRecursivo(secaoEl);abrirRecursivo(secaoEl);}
  marcarCaminho(secaoEl);
  document.body.classList.add('imprimir-parcial');
  flash((modoTudo?'Imprimindo tudo: ':'Imprimindo só o visível: ')+no.texto);
  setTimeout(()=>window.print(),200);
}
window.addEventListener('afterprint',()=>{
  document.body.classList.remove('imprimir-parcial');
  document.querySelectorAll('[data-no-caminho]').forEach(e=>delete e.dataset.noCaminho);
});

/* ---------- copiar ---------- */
function textoDeNo(no){
  const linhas=[];
  const percorrer=(n,nivel)=>{
    if(n.tipo==='heading'){
      linhas.push('#'.repeat(Math.max(1,nivel))+' '+n.texto);
      (n.filhos||[]).forEach(f=>percorrer(f,nivel+1));
    }else if(n.tipo==='linha'){
      linhas.push(n.texto);
    }else if(n.filhos){ n.filhos.forEach(f=>percorrer(f,nivel)); }
  };
  percorrer(no,no.nivel||1);
  return linhas.join('\n');
}
function textoVisivelDoDOM(elInicial){
  const linhas=[];
  const percorrerFilhosDe=(container)=>{
    if(!container) return;
    [...container.children].forEach(child=>{
      if(child.classList.contains('secao')) percorrerSecao(child);
      else if(child.classList.contains('coord-wrap')) percorrerCoordWrap(child);
    });
  };
  const percorrerSecao=(el)=>{
    const titulo=el.querySelector(':scope > .heading-row .titulo');
    if(titulo) linhas.push('#'.repeat(Math.max(1,+el.dataset.nivel||1))+' '+titulo.textContent);
    const inner=el.querySelector(':scope > .filhos-inner');
    if(!inner||inner.hidden) return;
    inner.querySelectorAll(':scope > .paragrafo').forEach(p=>linhas.push(p.textContent.trim()));
    percorrerFilhosDe(inner);
  };
  const percorrerCoordWrap=(wrap)=>{
    const marca=wrap.querySelector(':scope > .coordenada .marca-coord');
    if(marca) linhas.push('['+marca.textContent+']');
    wrap.querySelectorAll(':scope > .paragrafo').forEach(p=>linhas.push(p.textContent.trim()));
    percorrerFilhosDe(wrap);
  };
  if(elInicial.classList.contains('secao')) percorrerSecao(elInicial);
  else percorrerCoordWrap(elInicial);
  return linhas.join('\n');
}
async function copiarSecao(secaoEl,no,modoTudo){
  const texto=modoTudo?textoDeNo(no):textoVisivelDoDOM(secaoEl);
  if(!texto.trim()){flash('Nada visível para copiar — abra a seção primeiro');return;}
  try{await navigator.clipboard.writeText(texto);flash((modoTudo?'Copiado (tudo): ':'Copiado (visível): ')+no.texto);}
  catch(e){flash('Não foi possível copiar automaticamente');}
}
async function copiarLink(secaoEl,no){
  const base=location.href.split('#')[0];
  const url=secaoEl.id?base+'#'+secaoEl.id:base;
  try{await navigator.clipboard.writeText(url);flash('Link copiado');}catch(e){flash(url);}
}

function toggle(secao,forcar){
  const abrir=forcar!==undefined?forcar:!secao.classList.contains('aberto');
  if(abrir) construir(secao);
  secao.classList.toggle('aberto',abrir);
  secao._inner.hidden=!abrir;
  secao._toggleBtn.setAttribute('aria-expanded',abrir?'true':'false');
}
function abrirTudo(abrir){
  if(!raizEl) return;
  const pilha=[...raizEl.querySelectorAll(':scope > .secao')];
  while(pilha.length){
    const s=pilha.pop(); toggle(s,abrir);
    if(abrir) pilha.push(...s._inner.querySelectorAll(':scope > .secao'));
    else s._inner.querySelectorAll('.secao').forEach(x=>toggle(x,false));
  }
}

/* ---------- link permanente: abre o caminho até a âncora ---------- */
function irParaAncora(hash){
  if(!hash||hash.length<2) return false;
  const alvo=hash.slice(1);
  const caminho=[];
  const achar=(no)=>{
    for(const f of (no.filhos||[])){
      if(f.el && f.el.id===alvo){caminho.push(f);return true;}
      if(f.tipo==='heading'){caminho.push(f); if(achar(f)) return true; caminho.pop();}
    }
    return false;
  };
  if(!achar(arvore)) return false;
  for(const no of caminho){ if(no._secao) toggle(no._secao,true); else if(no.pai&&no.pai._secao) toggle(no.pai._secao,true); }
  const el=document.getElementById(alvo);
  if(el){el.scrollIntoView({block:'center'});el.classList.add('lendo-agora');setTimeout(()=>el.classList.remove('lendo-agora'),2500);return true;}
  return false;
}

/* ============ TTS ============ */
let fila=[],idx=0,lendo=false;
/* Voz para o idioma DECLARADO na linha (etiqueta `^eng` no .md, virada em
   lang= pelo gerador). Latim não tem voz em sistema nenhum: o italiano é a
   aproximação viva mais próxima da pronúncia eclesiástica — mesma escolha do
   app, em src/lib/idioma.ts. */
const VOZ_DE={'pt-BR':'pt-BR','en':'en-US','la':'it-IT','grc':'el-GR','he':'he-IL','ru':'ru-RU'};
function coletar(no,out){
  /* Carrega o lang junto com o texto: sem ele a etiqueta de idioma marcaria o
     HTML mas não trocaria a voz, e a linha em inglês sairia com sotaque
     brasileiro — que é exatamente o problema que a etiqueta veio resolver. */
  const declarado=no.el&&no.el.getAttribute?no.el.getAttribute('lang'):null;
  if(no.tipo==='heading'||no.tipo==='linha') out.push({texto:no.texto,lang:declarado});
  (no.filhos||[]).forEach(f=>coletar(f,out));
  return out;
}
function falar(item,fim){
  if(!('speechSynthesis' in window)){flash('Sem leitura em voz alta neste navegador');return;}
  const u=new SpeechSynthesisUtterance(item.texto);
  // Declarado vence detectado: o que o autor escreveu não se discute.
  u.lang=(item.lang&&VOZ_DE[item.lang])||idiomaDoTexto(item.texto).voz;
  u.rate=.98;u.onend=fim;speechSynthesis.speak(u);
}
function lerSecao(no){parar();fila=coletar(no,[]);idx=0;lendo=true;anunciar('Lendo '+no.texto);proximo();}
function lerTudo(){parar();fila=coletar(arvore,[]);idx=0;lendo=true;
  document.getElementById('btn-ouvir-tudo').setAttribute('aria-pressed','true');anunciar('Lendo o rolo');proximo();}
function proximo(){if(!lendo||idx>=fila.length){parar();return;}falar(fila[idx++],proximo);}
function parar(){lendo=false;if('speechSynthesis'in window)speechSynthesis.cancel();
  document.getElementById('btn-ouvir-tudo')?.setAttribute('aria-pressed','false');}

let ft;function flash(m){const e=document.getElementById('flash');e.textContent=m;e.classList.add('show');clearTimeout(ft);ft=setTimeout(()=>e.classList.remove('show'),1600);}
function anunciar(m){document.getElementById('anuncio').textContent=m;}

/* ============ Ξ — a estrutura desta obra ============
   Lista os cabeçalhos do primeiro nível. Se a obra tem UM só (o próprio
   título, caso da maioria), desce um nível e lista os capítulos — senão o
   painel abriria com um item e não serviria para nada. Sem estrutura
   suficiente, o botão se retira em vez de abrir um painel vazio. */
function montarSumario(){
  const painel=document.getElementById('ui-sumario'), botao=document.getElementById('ui-xi');
  if(!painel||!botao) return;
  let itens=arvore.filhos.filter(n=>n.tipo==='heading');
  let recuado=false;
  if(itens.length===1 && itens[0]._secao){
    construir(itens[0]._secao);
    const filhos=itens[0].filhos.filter(n=>n.tipo==='heading' && n._secao);
    if(filhos.length>1){ itens=[itens[0]].concat(filhos); recuado=true; }
  }
  if(itens.length<2){ botao.hidden=true; return; }
  const ul=document.createElement('ul');
  itens.forEach((no,i)=>{
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button'; b.textContent=no.texto;
    if(recuado && i>0) b.className='nivel2';
    b.addEventListener('click',()=>{
      if(!no._secao) return;
      /* abre o caminho inteiro até a seção — mesma lógica do link permanente */
      let p=no._secao;
      while(p && p.classList && p.classList.contains('secao')){
        toggle(p,true);
        p=p.parentElement && p.parentElement.closest('.secao');
      }
      no._secao.scrollIntoView({block:'start'});
      painel.hidden=true; botao.setAttribute('aria-expanded','false');
    });
    li.appendChild(b); ul.appendChild(li);
  });
  painel.appendChild(ul);
  botao.addEventListener('click',()=>{
    const abrir=painel.hidden;
    painel.hidden=!abrir;
    botao.setAttribute('aria-expanded',abrir?'true':'false');
  });
}

/* ============ montagem ============ */
let arvore, raizEl;
function montar(){
  const fonte=document.getElementById('texto');
  if(!fonte) return;
  arvore=parseDOM(fonte);
  raizEl=document.createElement('div');
  raizEl.id='texto';                       // o link "pular para o texto" continua valendo
  fonte.replaceWith(raizEl);               // o texto sai do documento e passa a viver na árvore
  arvore.filhos.forEach(no=>raizEl.appendChild(renderFilho(no)));
  // o menu de ajustes é do motor, não da obra: fica fora do texto, e fora da cópia/impressão
  const menu=document.createElement('div');menu.className='menu-ajustes';
  parseMD(MENU_MD).filhos.forEach(no=>menu.appendChild(renderFilho(no)));
  raizEl.parentNode.insertBefore(menu,raizEl.nextSibling);

  document.querySelectorAll('.barra-topo [data-cmd]').forEach(b=>b.addEventListener('click',()=>acoes[b.dataset.cmd]&&acoes[b.dataset.cmd]()));
  document.getElementById('btn-ouvir-tudo').addEventListener('click',lerTudo);
  document.getElementById('btn-parar').addEventListener('click',()=>{parar();flash('Leitura parada');});

  const t=ler('pa:tema'); if(t) aplicarTema(t,'');
  const f=ler('pa:fonte'); if(f) document.documentElement.style.setProperty('--font-scale',f);

  // primeiro nível sempre aberto: quem chega vê o começo da obra, não uma lista de gavetas
  const primeira=raizEl.querySelector(':scope > .secao');
  if(primeira) toggle(primeira,true);

  montarSumario();

  if(!irParaAncora(location.hash) && location.hash) {/* âncora inexistente: silêncio */}
  window.addEventListener('hashchange',()=>irParaAncora(location.hash));
  window.addEventListener('beforeprint',()=>abrirTudo(true));
}
/* Rede de segurança: como o texto-fonte está escondido por CSS assim que há
   JavaScript, uma falha aqui deixaria a tela em branco — o pior desfecho
   possível para um arquivo cuja razão de existir é ser legível. Se o motor cair
   por qualquer motivo, a classe sai e o texto reaparece: perde-se o recolhimento
   e a voz, não se perde a obra. */
try{ montar(); }
catch(e){
  document.documentElement.classList.remove('js');
  const el=document.getElementById('texto');
  if(el && !el.classList.contains('fonte-texto')) el.className='fonte-texto';
  console.error('Motor do rolo falhou; texto-fonte restaurado.',e);
}
