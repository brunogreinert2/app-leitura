# Publica o app no GitHub Pages a cada push na master.
# Atualizar o corpus = git push; o site se reconstrói sozinho.
name: Deploy no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # o portão importa o gerador_rolo: sem isto, o __pycache__ (com a hora)
      # nasceria em scripts/rolo e mudaria a chave do cache dos rolos
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      # ---- portão do acervo (Saneamento, 2026-09-29) ----
      # Antes de construir qualquer coisa: nenhum id publicado sumiu (LEI 6) e
      # nenhum arquivo do acervo piorou contra a norma. Falhou aqui, não publica.
      # O mesmo portão roda no commit (.githooks/pre-commit); este pega quem
      # commitou sem o gancho ativado.
      #
      # O portão confere um commit. O mesmo commit já conferido não precisa de
      # outra volta (2026-11-04): o post novo do Diário dispara este deploy do
      # mesmo commit do app, que já passou. A marca «passou» fica no cache do
      # Actions, pela SHA do commit; commit novo, ou cache vencido, confere tudo.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: O portão já passou neste commit?
        id: portao-visto
        uses: actions/cache/restore@v4
        with:
          path: .portao-ok
          key: portao-ok-${{ github.sha }}
          lookup-only: true
      # sempre: o Pórtico também usa (gerar.py importa o validar_corpus)
      - name: Pacotes Python do acervo
        run: pip install -r scripts/acervo/requirements.txt
      - name: Portão do acervo
        if: steps.portao-visto.outputs.cache-hit != 'true'
        run: |
          python scripts/acervo/portao_acervo.py --completo
          echo "${{ github.sha }}" > .portao-ok
      - name: Guardar que o portão passou neste commit
        if: steps.portao-visto.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .portao-ok
          key: portao-ok-${{ github.sha }}
      - name: Portão pulado
        if: steps.portao-visto.outputs.cache-hit == 'true'
        run: echo "Este commit (${{ github.sha }}) já passou no portão num deploy anterior."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/motor é cópia do motor do ecossistema (C:\Claude\parser): não se edita à mão
      - run: node scripts/conferir-motor.mjs
      # Gancho sem bit de execução no git é IGNORADO calado num clone Linux/Mac:
      # o commit passa sem portão e ninguém fica sabendo (visto em 2026-10-14).
      # No Windows o bit não aparece (core.fileMode=false), por isso a guarda é aqui.
      - run: |
          ruins=$(git ls-files -s .githooks | awk '$1 != "100755" {print $4}')
          if [ -n "$ruins" ]; then
            echo "Gancho sem permissão de execução no git: $ruins"
            echo "Conserto: git update-index --chmod=+x <arquivo>"
            exit 1
          fi
      - run: npx tsc -b
      # Domínio próprio (pedraangular.app.br) serve na RAIZ do site
      - run: npx vite build --base=/
      # nenhuma surrogata Unicode estragada pelo empacotador (ver vite.config.ts)
      - run: node scripts/conferir-surrogatas.mjs dist

      # ---- rolos estáticos: a mesma obra numa porta que dispensa JavaScript ----
      # O app é uma SPA: quem só busca a URL (crawler, agente de IA) recebe a
      # casca vazia. Os rolos são a cópia com o texto escrito no <body>.
      #
      # São DERIVADOS do corpus e por isso nascem aqui, no build, e não no git:
      # commitá-los engordaria o repositório para sempre e faria de cada correção
      # de vírgula num .md um diff de centenas de arquivos.
      #
      # --sem-gemeo-md porque o corpus já é servido em /livros/ — copiá-lo para
      # dentro de /rolo/ duplicaria 98 MB no site sem ganhar nada.
      #
      # Os rolos só dependem das obras (public/livros), do gerador (scripts/rolo)
      # e do CITATION.cff: se nenhum mudou, saem iguais, e vêm do cache
      # (2026-11-04, o deploy do Diário). O carimbo «Gerado em … commit …» fica
      # o da geração de verdade.
      - name: Rolos já gerados deste acervo?
        id: rolos-vistos
        uses: actions/cache/restore@v4
        with:
          path: dist/rolo
          key: rolos-${{ hashFiles('public/livros/**', 'scripts/rolo/**', '!scripts/rolo/__pycache__/**', 'CITATION.cff') }}
      - name: Gerar rolos estáticos em /rolo/
        if: steps.rolos-vistos.outputs.cache-hit != 'true'
        run: |
          python scripts/rolo/gerador_rolo.py --tudo --sem-gemeo-md \
            --corpus public/livros \
            --template scripts/rolo/rolo_template.html \
            --fontes scripts/rolo/fontes \
            --saida dist/rolo
          echo "rolos gerados: $(ls dist/rolo/*.html | wc -l) · $(du -sh dist/rolo | cut -f1)"
      - name: Guardar os rolos
        if: steps.rolos-vistos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/rolo
          key: ${{ steps.rolos-vistos.outputs.cache-primary-key }}
      - name: Rolos do cache
        if: steps.rolos-vistos.outputs.cache-hit == 'true'
        run: |
          echo "rolos do cache (acervo igual): $(ls dist/rolo/*.html | wc -l) · $(du -sh dist/rolo | cut -f1)"

      # ---- o Pórtico em /portico/ (2026-09-29) ----
      # A norma, o andamento público, o diário e o conferidor de .md. As fontes
      # moram no repositório portico; este passo só o monta, lendo daqui os
      # temas, as fontes e a norma do acervo (scripts/acervo). Como os rolos,
      # é derivado: nasce no build e não entra no git.
      - name: Montar o Pórtico em /portico/
        run: |
          git clone --depth 1 https://github.com/brunogreinert2/portico.git ../portico
          python ../portico/gerar.py --publico dist/portico --app-leitura .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
